[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halloween-art"
version = "0.1.0"
description = "Halloween ASCII art in your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Айк", email = "you@example.com"}]

[project.scripts]
halloween = "halloween.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]